name: frontend-build

on:
  push:
    branches:
      - main
      - feat/tenant-store-foundation
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build frontend assets (Ubuntu x64)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          package-manager-cache: false

      # The lockfile is regenerated by npm install because package.json was
      # intentionally changed away from Vite Plus and the committed lockfile
      # still describes the old dependency graph.
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Build production assets
        run: npm run build

      - name: Verify Laravel Vite manifest
        run: test -s public/build/manifest.json

      - name: Upload Laravel production assets
        uses: actions/upload-artifact@v4
        with:
          name: public-build-${{ github.sha }}
          path: public/build/
          if-no-files-found: error
          retention-days: 14
